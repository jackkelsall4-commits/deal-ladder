name: Deal Ladder

# Refreshes data/jobs.json every morning so the Deal Ladder page stays live.
on:
  schedule:
    - cron: "41 5 * * *"   # 05:41 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find and rank roles
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          # Optional: free keys that widen the search to the whole UK market.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python -m finder.run --top 20
      - name: Commit results
        run: |
          git config user.name "deal-ladder-bot"
          git config user.email "deal-ladder-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh deal rankings"
          # Code may have been uploaded while this ran; put the new rankings on top of it.
          git pull --rebase -X theirs origin main
          git push
